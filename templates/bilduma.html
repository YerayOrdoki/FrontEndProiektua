<h2>Nire Bilduma</h2>

<div id="bilduma-kontrolak" class="panel kontrolak-flex">
  <!-- Iragazi -->
  <div>
    <label for="input-filtroa">Iragazi generoz:</label>
    <input type="text" id="input-filtroa" placeholder="Adibidez: Shooter">
    <button id="btn-iragazi">Iragazi</button>
  </div>
  
  <!-- Ordenatu -->
  <div>
    <label for="select-ordena">Ordenatu:</label>
    <select id="select-ordena">
      <option value="balorazioa-desc">Balorazioa (Handienetik txikienera)</option>
      <option value="balorazioa-asc">Balorazioa (Txikienetik handienera)</option>
    </select>
    <button id="btn-ordenatu">Ordenatu</button>
  </div>
</div>

<div class="bilduma-edukiak">

  <section id="items-bilduma" class="panel">
    <h3>Gordetako Item-ak</h3>
    <div id="lista-bilduma" class="lista-grid">
      <p>Oraindik ez duzu item-ik gorde.</p>
    </div>
  </section>

  <div id="panel-bilduma" class="panel">
    <h3>Item hautatua</h3>
    <div id="xehetasun-bilduma">
      <p>Item bat aukeratu bere xehetasunak bistaratzeko.</p>
    </div>
  </div>

</div>
